[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radarlab"
version = "0.1.0"
description = "Research-grade FMCW MIMO radar simulation framework (reference implementation)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Enes Erdoğan" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9"]

[project.optional-dependencies]
examples = ["matplotlib>=3.5"]
dev = ["pytest>=7", "matplotlib>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: Monte-Carlo tests (deselect with -m 'not slow')"]
addopts = "-q"
